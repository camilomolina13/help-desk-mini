{% extends "base.html" %}

{% block title %}Editar Ticket{% endblock %}

{% block content %}
<div class="container mx-auto p-6 max-w-lg">
    <h1 class="text-2xl font-bold mb-4">Editar Ticket</h1>

    <form method="POST" class="space-y-4">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700">Título</label>
            <input type="text" name="title" id="title" required
                class="w-full mt-1 rounded border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200"
                value="{{ticket.title}}">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Contenido</label>
            <textarea name="description" id="description" rows="4" required
                class="w-full mt-1 rounded border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200">{{ticket.description}}</textarea>
        </div>
        <div>
            <select name="status" id="status"
                class="w-full mt-1 rounded border-gray-300 focus:border-blue-500 focus:ring focus:ring-blue-200">

                {% for status in statuses %}
                    <option value="{{ status }}"
                        {% if ticket.status == status %}selected{% endif %}>
                        {{ status }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="text-right">
            <input type="submit" value="Guardar cambios"
                class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 cursor-pointer">
        </div>
    </form>
</div>
{% endblock %}
